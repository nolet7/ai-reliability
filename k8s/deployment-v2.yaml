# k8s/deployment-v2.yaml
#
# Purpose:
# Creates a v2 canary deployment for Istio traffic splitting.
#
# This deployment uses the same container image but overrides MODEL_VERSION
# so we can prove traffic is reaching v2.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: as-ai-quality-service-v2
  namespace: ai-reliability-poc
  labels:
    app.kubernetes.io/name: as-ai-quality-service
    app.kubernetes.io/part-of: as-ai-reliability
    app.kubernetes.io/component: inference-api
    app.kubernetes.io/version: v1.0.4
    environment: poc
    owner: sre-platform-team
    model_name: as-quality-classifier
    model_version: v1.0.4
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: as-ai-quality-service
      app.kubernetes.io/component: inference-api
      environment: poc
      version: v2

  template:
    metadata:
      labels:
        app.kubernetes.io/name: as-ai-quality-service
        app.kubernetes.io/part-of: as-ai-reliability
        app.kubernetes.io/component: inference-api
        app.kubernetes.io/version: v1.0.4
        environment: poc
        owner: sre-platform-team
        model_name: as-quality-classifier
        model_version: v1.0.4
        version: v2
      annotations:
        sre.as.ai/reliability-layer: "enabled"
        sre.as.ai/health-live: "/health/live"
        sre.as.ai/health-ready: "/health/ready"
        sre.as.ai/health-model: "/health/model"
        sre.as.ai/audit-required: "true"
        sre.as.ai/dynatrace-service: "as-ai-quality-service"
        sre.as.ai/runbook: "runbooks/as-ai-quality-service.md"

    spec:
      serviceAccountName: as-ai-quality-service-sa
      automountServiceAccountToken: false

      containers:
        - name: as-ai-quality-service
          image: noletengine/as-ai-quality-service:poc
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: as-ai-quality-service-config
            - secretRef:
                name: as-ai-quality-service-db-secret
            - secretRef:
                name: dynatrace-otel-secret

          env:
            - name: MODEL_VERSION
              value: "v1.0.4"

          startupProbe:
            httpGet:
              path: /health/model
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: audit-log-volume
              mountPath: /app/local/generated/audit

      volumes:
        - name: audit-log-volume
          emptyDir: {}
