# k8s/secret-example.yaml
#
# Purpose:
# Example Kubernetes Secret for database connection values.
#
# Important:
# This is a POC example only.
# In a production setup, secrets should come from Vault, External Secrets Operator,
# cloud secret managers, or another approved enterprise secret management platform.
#
# This file is named secret-example.yaml to avoid pretending this is production secret handling.

apiVersion: v1
kind: Secret
metadata:
  name: as-ai-quality-service-db-secret
  namespace: ai-reliability-poc
  labels:
    app.kubernetes.io/name: as-ai-quality-service
    app.kubernetes.io/part-of: as-ai-reliability
    app.kubernetes.io/component: database-config
    environment: poc
type: Opaque
stringData:
  DB_HOST: "as-ai-postgres-poc"
  DB_PORT: "5432"
  DB_NAME: "as_ai_poc"
  DB_USER: "as_user"
  DB_PASSWORD: "as_password"
