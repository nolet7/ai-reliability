# k8s/serviceaccount.yaml
#
# Purpose:
# Creates a dedicated Kubernetes ServiceAccount for the ASR AI quality service.
#
# Why this matters:
# The application should not run with the default service account.
# A dedicated ServiceAccount makes permissions explicit and auditable.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: asr-ai-quality-service-sa
  namespace: ai-reliability-poc
  labels:
    app.kubernetes.io/name: asr-ai-quality-service
    app.kubernetes.io/part-of: asr-ai-reliability
    app.kubernetes.io/component: inference-api
    environment: poc
    owner: sre-platform-team
automountServiceAccountToken: false
