# k8s/dynatrace-otel-secret-example.yaml
#
# Purpose:
# Safe example template for Dynatrace OTLP secret.
#
# Do not put real Dynatrace tokens in this file.
# Create the real secret with kubectl create secret instead.

apiVersion: v1
kind: Secret
metadata:
  name: dynatrace-otel-secret
  namespace: ai-reliability-poc
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://YOUR_DYNATRACE_ENVIRONMENT.live.dynatrace.com/api/v2/otlp"
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Api-Token YOUR_DYNATRACE_TOKEN"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
