# k8s/deployment.yaml
#
# Purpose:
# Deploys the ASR AI quality service into Kubernetes.
#
# Istio note:
# The pod template includes version: v1 for Istio DestinationRule subset routing.
# Do not add version to spec.selector.matchLabels because Deployment selectors are immutable.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-ai-quality-service
  namespace: ai-reliability-poc
  labels:
    app.kubernetes.io/name: asr-ai-quality-service
    app.kubernetes.io/part-of: asr-ai-reliability
    app.kubernetes.io/component: inference-api
    app.kubernetes.io/version: v1.0.3
    environment: poc
    owner: sre-platform-team
    model_name: asr-quality-classifier
    model_version: v1.0.3
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: asr-ai-quality-service
      app.kubernetes.io/component: inference-api
      environment: poc

  template:
    metadata:
      labels:
        app.kubernetes.io/name: asr-ai-quality-service
        app.kubernetes.io/part-of: asr-ai-reliability
        app.kubernetes.io/component: inference-api
        app.kubernetes.io/version: v1.0.3
        environment: poc
        owner: sre-platform-team
        model_name: asr-quality-classifier
        model_version: v1.0.3
        version: v1
      annotations:
        sre.asr.ai/reliability-layer: "enabled"
        sre.asr.ai/health-live: "/health/live"
        sre.asr.ai/health-ready: "/health/ready"
        sre.asr.ai/health-model: "/health/model"
        sre.asr.ai/audit-required: "true"
        sre.asr.ai/dynatrace-service: "asr-ai-quality-service"
        sre.asr.ai/runbook: "runbooks/asr-ai-quality-service.md"

    spec:
      serviceAccountName: asr-ai-quality-service-sa
      automountServiceAccountToken: false

      containers:
        - name: asr-ai-quality-service
          image: noletengine/asr-ai-quality-service:poc
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: asr-ai-quality-service-config
            - secretRef:
                name: asr-ai-quality-service-db-secret
            - secretRef:
                name: dynatrace-otel-secret

          startupProbe:
            httpGet:
              path: /health/model
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: audit-log-volume
              mountPath: /app/local/generated/audit

      volumes:
        - name: audit-log-volume
          emptyDir: {}
