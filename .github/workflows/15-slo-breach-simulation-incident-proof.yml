name: 15 - SLO Breach Simulation and Incident Proof

on:
  workflow_dispatch:
    inputs:
      breach_scenario:
        description: "Breach scenario to simulate"
        required: true
        default: "model_version_and_latency"
        type: choice
        options:
          - model_version_and_latency
          - latency
          - model_version
          - availability
      fail_workflow_for_incident:
        description: "Fail this workflow intentionally to trigger ServiceNow incident automation"
        required: false
        default: "true"

permissions:
  contents: read
  actions: read

jobs:
  slo-breach-simulation:
    name: Simulate SLO breach and produce incident evidence
    runs-on: ubuntu-latest

    env:
      DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
      DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}

      APP_NAME: ${{ vars.APP_NAME }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      EXPECTED_MODEL_VERSION: ${{ vars.EXPECTED_MODEL_VERSION }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

      BREACH_SCENARIO: ${{ inputs.breach_scenario }}
      FAIL_WORKFLOW_FOR_INCIDENT: ${{ inputs.fail_workflow_for_incident }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize breach simulation variables
        run: |
          if [ -z "${APP_NAME:-}" ]; then
            echo "APP_NAME=as-ai-quality-service" >> "$GITHUB_ENV"
          fi

          if [ -z "${SERVICE_NAME:-}" ]; then
            echo "SERVICE_NAME=as-ai-quality-service" >> "$GITHUB_ENV"
          fi

          if [ -z "${ENVIRONMENT:-}" ]; then
            echo "ENVIRONMENT=poc" >> "$GITHUB_ENV"
          fi

          if [ -z "${EXPECTED_MODEL_VERSION:-}" ]; then
            echo "EXPECTED_MODEL_VERSION=v1.0.3" >> "$GITHUB_ENV"
          fi

          if [ -z "${PUBLIC_BASE_URL:-}" ]; then
            echo "PUBLIC_BASE_URL=http://139.144.255.92" >> "$GITHUB_ENV"
          fi

      - name: Validate Dynatrace secrets
        run: |
          if [ -z "${DYNATRACE_ENV_URL:-}" ]; then
            echo "DYNATRACE_ENV_URL is missing."
            exit 1
          fi

          if [ -z "${DYNATRACE_API_TOKEN:-}" ]; then
            echo "DYNATRACE_API_TOKEN is missing."
            exit 1
          fi

          echo "Dynatrace secrets are present."

      - name: Simulate SLO breach
        run: |
          chmod +x scripts/observability/simulate_slo_breach_and_publish_evidence.py
          python3 scripts/observability/simulate_slo_breach_and_publish_evidence.py

      - name: Publish SLO breach simulation summary
        if: always()
        run: |
          if [ -f reports/slo-breach-simulation/slo-breach-simulation-summary.md ]; then
            cat reports/slo-breach-simulation/slo-breach-simulation-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SLO breach simulation summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SLO breach simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-15-slo-breach-simulation-incident-proof
          path: reports/slo-breach-simulation/
