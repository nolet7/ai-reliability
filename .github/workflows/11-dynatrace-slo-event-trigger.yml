name: 11 - Dynatrace SLO Event Trigger

on:
  workflow_dispatch:
    inputs:
      force_event_test:
        description: "Force a Dynatrace test event even if all SLOs are healthy"
        required: false
        default: "true"

  workflow_run:
    workflows:
      - "10 - Dynatrace SLO Catalog Metrics"
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  dynatrace-slo-event-trigger:
    name: Publish Dynatrace SLO event trigger
    runs-on: ubuntu-latest

    env:
      DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
      DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}

      APP_NAME: ${{ vars.APP_NAME }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      EXPECTED_MODEL_VERSION: ${{ vars.EXPECTED_MODEL_VERSION }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

      FORCE_EVENT_TEST: ${{ inputs.force_event_test }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize Dynatrace event variables
        run: |
          if [ -z "${APP_NAME:-}" ]; then
            echo "APP_NAME=as-ai-quality-service" >> "$GITHUB_ENV"
          fi

          if [ -z "${SERVICE_NAME:-}" ]; then
            echo "SERVICE_NAME=as-ai-quality-service" >> "$GITHUB_ENV"
          fi

          if [ -z "${ENVIRONMENT:-}" ]; then
            echo "ENVIRONMENT=poc" >> "$GITHUB_ENV"
          fi

          if [ -z "${EXPECTED_MODEL_VERSION:-}" ]; then
            echo "EXPECTED_MODEL_VERSION=v1.0.3" >> "$GITHUB_ENV"
          fi

          if [ -z "${PUBLIC_BASE_URL:-}" ]; then
            echo "PUBLIC_BASE_URL=http://139.144.255.92" >> "$GITHUB_ENV"
          fi

          if [ -z "${FORCE_EVENT_TEST:-}" ]; then
            echo "FORCE_EVENT_TEST=false" >> "$GITHUB_ENV"
          fi

      - name: Validate Dynatrace secrets
        run: |
          if [ -z "${DYNATRACE_ENV_URL:-}" ]; then
            echo "DYNATRACE_ENV_URL is missing."
            exit 1
          fi

          if [ -z "${DYNATRACE_API_TOKEN:-}" ]; then
            echo "DYNATRACE_API_TOKEN is missing."
            exit 1
          fi

          echo "Dynatrace secrets are present."

      - name: Publish Dynatrace SLO event trigger
        run: |
          chmod +x scripts/observability/publish_dynatrace_slo_event.py
          python3 scripts/observability/publish_dynatrace_slo_event.py

      - name: Publish Dynatrace event summary
        if: always()
        run: |
          if [ -f reports/dynatrace-slo-events/dynatrace-slo-event-summary.md ]; then
            cat reports/dynatrace-slo-events/dynatrace-slo-event-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dynatrace SLO event summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Dynatrace SLO event evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-12-dynatrace-slo-event-trigger
          path: reports/dynatrace-slo-events/
