name: 12 - Dynatrace SLO as Code

on:
  workflow_dispatch:
    inputs:
      enable_test_event:
        description: "Create a Dynatrace test event after generating SLO-as-code files"
        required: false
        default: "true"
      enable_api_create:
        description: "Attempt Dynatrace API capability checks"
        required: false
        default: "true"

permissions:
  contents: read
  actions: read

jobs:
  dynatrace-slo-as-code:
    name: Generate Dynatrace SLO catalog as code
    runs-on: ubuntu-latest

    env:
      DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
      DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}

      APP_NAME: ${{ vars.APP_NAME }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      EXPECTED_MODEL_VERSION: ${{ vars.EXPECTED_MODEL_VERSION }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

      DYNATRACE_ENABLE_TEST_EVENT: ${{ inputs.enable_test_event }}
      DYNATRACE_ENABLE_API_CREATE: ${{ inputs.enable_api_create }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize variables
        run: |
          if [ -z "${APP_NAME:-}" ]; then
            echo "APP_NAME=as-ai-quality-service" >> "$GITHUB_ENV"
          fi

          if [ -z "${SERVICE_NAME:-}" ]; then
            echo "SERVICE_NAME=as-ai-quality-service" >> "$GITHUB_ENV"
          fi

          if [ -z "${ENVIRONMENT:-}" ]; then
            echo "ENVIRONMENT=poc" >> "$GITHUB_ENV"
          fi

          if [ -z "${EXPECTED_MODEL_VERSION:-}" ]; then
            echo "EXPECTED_MODEL_VERSION=v1.0.3" >> "$GITHUB_ENV"
          fi

          if [ -z "${PUBLIC_BASE_URL:-}" ]; then
            echo "PUBLIC_BASE_URL=http://139.144.255.92" >> "$GITHUB_ENV"
          fi

      - name: Validate Dynatrace secrets
        run: |
          if [ -z "${DYNATRACE_ENV_URL:-}" ]; then
            echo "DYNATRACE_ENV_URL is missing."
            exit 1
          fi

          if [ -z "${DYNATRACE_API_TOKEN:-}" ]; then
            echo "DYNATRACE_API_TOKEN is missing."
            exit 1
          fi

          echo "Dynatrace secrets are present."

      - name: Generate Dynatrace SLO catalog as code
        run: |
          chmod +x scripts/observability/automate_dynatrace_slo_catalog_as_code.py
          python3 scripts/observability/automate_dynatrace_slo_catalog_as_code.py

      - name: Publish Dynatrace SLO-as-code summary
        if: always()
        run: |
          if [ -f reports/dynatrace-slo-as-code/dynatrace-slo-as-code-summary.md ]; then
            cat reports/dynatrace-slo-as-code/dynatrace-slo-as-code-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dynatrace SLO-as-code summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Dynatrace SLO-as-code evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-13-dynatrace-slo-as-code
          path: |
            reports/dynatrace-slo-as-code/
            dynatrace/slo-as-code/
