name: 03 - Runtime Release Gate

on:
  workflow_dispatch:
    inputs:
      expected_model_version:
        description: "Expected model version to validate at runtime"
        required: false
        default: "v1.0.3"
      base_url:
        description: "Optional base URL. Example: http://139.144.255.92"
        required: false
        default: ""
      request_count:
        description: "Number of runtime requests to execute"
        required: false
        default: "30"
      max_p95_ms:
        description: "Maximum allowed /predict p95 latency in milliseconds"
        required: false
        default: "1000"

  workflow_run:
    workflows:
      - "02 - Enterprise Deploy to POC Kubernetes"
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  runtime-release-gate:
    name: Validate runtime release health
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      NAMESPACE: ${{ vars.NAMESPACE }}
      APP_NAME: ${{ vars.APP_NAME }}
      DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
      EXPECTED_MODEL_VERSION: ${{ vars.EXPECTED_MODEL_VERSION }}

      KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT }}
      ISTIO_INGRESS_IP: ${{ vars.ISTIO_INGRESS_IP }}
      APP_LOADBALANCER_IP: ${{ vars.APP_LOADBALANCER_IP }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

      RUNTIME_GATE_REQUESTS: ${{ vars.RUNTIME_GATE_REQUESTS }}
      RUNTIME_GATE_MAX_P95_MS: ${{ vars.RUNTIME_GATE_MAX_P95_MS }}
      RUNTIME_GATE_MAX_FAILURES: ${{ vars.RUNTIME_GATE_MAX_FAILURES }}
      PREDICT_PAYLOAD: ${{ vars.PREDICT_PAYLOAD }}

      INPUT_EXPECTED_MODEL_VERSION: ${{ inputs.expected_model_version }}
      INPUT_BASE_URL: ${{ inputs.base_url }}
      INPUT_REQUEST_COUNT: ${{ inputs.request_count }}
      INPUT_MAX_P95_MS: ${{ inputs.max_p95_ms }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl python3

      - name: Normalize runtime gate variables
        run: |
          # Defaults are applied here so missing GitHub variables do not break the workflow.

          if [ -z "${NAMESPACE:-}" ]; then
            echo "NAMESPACE=ai-reliability-poc" >> "$GITHUB_ENV"
          fi

          if [ -z "${APP_NAME:-}" ]; then
            echo "APP_NAME=as-ai-quality-service" >> "$GITHUB_ENV"
          fi

          if [ -z "${DOCKER_IMAGE:-}" ]; then
            echo "DOCKER_IMAGE=noletengine/as-ai-quality-service" >> "$GITHUB_ENV"
          fi

          if [ -n "${INPUT_EXPECTED_MODEL_VERSION:-}" ]; then
            echo "EXPECTED_MODEL_VERSION=$INPUT_EXPECTED_MODEL_VERSION" >> "$GITHUB_ENV"
          elif [ -z "${EXPECTED_MODEL_VERSION:-}" ]; then
            echo "EXPECTED_MODEL_VERSION=v1.0.3" >> "$GITHUB_ENV"
          fi

          if [ -n "${INPUT_BASE_URL:-}" ]; then
            echo "PUBLIC_BASE_URL=$INPUT_BASE_URL" >> "$GITHUB_ENV"
          fi

          if [ -n "${INPUT_REQUEST_COUNT:-}" ]; then
            echo "RUNTIME_GATE_REQUESTS=$INPUT_REQUEST_COUNT" >> "$GITHUB_ENV"
          elif [ -z "${RUNTIME_GATE_REQUESTS:-}" ]; then
            echo "RUNTIME_GATE_REQUESTS=30" >> "$GITHUB_ENV"
          fi

          if [ -n "${INPUT_MAX_P95_MS:-}" ]; then
            echo "RUNTIME_GATE_MAX_P95_MS=$INPUT_MAX_P95_MS" >> "$GITHUB_ENV"
          elif [ -z "${RUNTIME_GATE_MAX_P95_MS:-}" ]; then
            echo "RUNTIME_GATE_MAX_P95_MS=1000" >> "$GITHUB_ENV"
          fi

          if [ -z "${RUNTIME_GATE_MAX_FAILURES:-}" ]; then
            echo "RUNTIME_GATE_MAX_FAILURES=0" >> "$GITHUB_ENV"
          fi

          if [ -z "${KUBE_CONTEXT:-}" ]; then
            echo "KUBE_CONTEXT=lke605802-ctx" >> "$GITHUB_ENV"
          fi

          if [ -z "${ISTIO_INGRESS_IP:-}" ]; then
            echo "ISTIO_INGRESS_IP=139.144.255.92" >> "$GITHUB_ENV"
          fi

          if [ -z "${APP_LOADBALANCER_IP:-}" ]; then
            echo "APP_LOADBALANCER_IP=139.144.255.192" >> "$GITHUB_ENV"
          fi

      - name: Decode kubeconfig
        run: |
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "KUBECONFIG_B64 secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          printf "%s" "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          kubectl config get-contexts
          kubectl config use-context "$KUBE_CONTEXT"
          kubectl cluster-info

      - name: Run runtime release gate
        run: |
          chmod +x scripts/release-gates/runtime_release_gate.sh
          scripts/release-gates/runtime_release_gate.sh

      - name: Publish runtime gate summary
        if: always()
        run: |
          if [ -f reports/runtime-release-gate/runtime-release-gate-summary.md ]; then
            cat reports/runtime-release-gate/runtime-release-gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Runtime release gate summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload runtime gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-runtime-release-gate-evidence
          path: reports/runtime-release-gate/
