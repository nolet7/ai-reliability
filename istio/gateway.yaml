# istio/gateway.yaml
#
# Purpose:
# Exposes the AS AI quality service through the Istio IngressGateway.
#
# This allows Istio VirtualService routing to control traffic splits
# between v1 and v2.

apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: as-ai-quality-gateway
  namespace: ai-reliability-poc
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
